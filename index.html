<style>

*{box-sizing:border-box}html,body{margin:0;min-height:100%;}body{background:#241108;color:#fff4e8;font-family:Arial,sans-serif;text-align:center}body::before{content:'';position:fixed;inset:0;z-index:-1;background:linear-gradient(#1d0e072d,#1d0e072d),url('assets/BALANCE_Autumn_background.png') center center/cover no-repeat}.page{min-height:100dvh;padding:26px 12px 40px;background:transparent}.brand{font-size:clamp(28px,7vw,44px);letter-spacing:.27em;margin:0 0 10px;padding-left:.27em}.tag{font-size:10px;letter-spacing:.2em}.intro{font-size:12px;opacity:.85;margin:18px 0}.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;position:relative;z-index:30}button,select{border:1px solid #fce8d9a0;border-radius:30px;background:#382016e8;color:white;padding:10px 13px;font:12px Arial;cursor:pointer}/* Envelope and letter share a single proportional coordinate system. */
.stage{width:min(94vw,570px);height:clamp(690px,135vw,830px);margin:20px auto 0;position:relative;isolation:isolate}
.env{position:absolute;width:100%;aspect-ratio:1278/762;top:59%;left:0;filter:drop-shadow(0 14px 18px #1607017a);perspective:1100px;transform-style:preserve-3d}
.piece{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none}
.back{z-index:1}.front{z-index:8;transition:clip-path .45s ease;clip-path:none}
.stage[data-state="opening"] .front,.stage[data-state="open"] .front{clip-path:polygon(0 0,50% 72%,100% 0,100% 100%,0 100%)}
.flap{z-index:5;transform-origin:50% 3%;transition:transform .85s ease;backface-visibility:visible;will-change:transform}
/* The twig rises separately from the letter, entirely behind the envelope front.
   The front is the physical occlusion mask throughout the animation. */
.autumn-twig{position:absolute;width:33%;height:auto;right:3%;top:-10%;pointer-events:none;user-select:none;filter:drop-shadow(0 3px 3px #2a100c50);opacity:0;transform:translateY(62%) scale(.96);transition:transform 1.45s cubic-bezier(.2,.68,.19,1),opacity .35s ease;will-change:transform,opacity}
.autumn-twig--behind{z-index:7}
.stage[data-state="opening"] .autumn-twig,.stage[data-state="open"] .autumn-twig{opacity:1;transform:translateY(0) scale(1);transition-delay:.75s,.75s}
.seal{z-index:10;transition:opacity .4s,transform .4s}.closed{z-index:12;transition:opacity .22s}
/* The clipping window extends UP only. The letter can never protrude below the envelope. */
.letter-clip{position:absolute;z-index:7;left:0;right:0;top:-130%;bottom:2%;overflow:hidden;pointer-events:none}
.letter{position:absolute;left:6%;width:88%;aspect-ratio:929/1327;height:auto;bottom:-160%;transition:bottom 1.5s cubic-bezier(.2,.68,.19,1);filter:drop-shadow(0 4px 7px #47240d55);isolation:isolate}
.paper{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;opacity:1}
.heading{position:absolute;top:17%;left:8%;width:84%;height:13%;object-fit:contain;pointer-events:none}
.heading[data-kind="important"]{transform:scale(.99)}.heading[data-kind="pleasant"]{transform:scale(.94)}.heading[data-kind="unexpected"]{transform:scale(.90)}
.message{position:absolute;top:33%;left:10%;width:80%;height:22%;overflow:hidden;color:#5b3927;font:clamp(13px,2.4vw,18px)/1.42 Georgia,serif;text-align:center;opacity:0;transition:opacity 1.15s ease-in-out;display:flex;align-items:center;justify-content:center}
.stage[data-state="opening"] .closed,.stage[data-state="open"] .closed{opacity:0}
.stage[data-state="opening"] .seal,.stage[data-state="open"] .seal{opacity:1;transform:none}
.stage[data-state="opening"] .flap,.stage[data-state="open"] .flap{transform:rotateX(-165deg);transition-delay:.2s}
.stage[data-state="opening"] .letter,.stage[data-state="open"] .letter{bottom:-10%;transition-delay:.75s}
.stage[data-state="open"] .message{opacity:1}
/* Separate signature, positioned in the visible area above the envelope's V fold. */
.letter-signature{position:absolute;top:56.5%;left:0;width:100%;color:#583824;font:clamp(10px,1.8vw,15px) Georgia,serif;letter-spacing:.38em;padding-left:.38em;text-align:center;opacity:0;transition:opacity .35s;z-index:2}
.letter-signature:before{content:"";display:block;width:40px;height:1px;background:#8d6b4e;margin:0 auto 9px}
.stage[data-state="open"] .letter-signature,.stage[data-state="opening"] .letter-signature{opacity:1}
.hint{max-width:570px;margin:20px auto;font:12px/1.5 Arial;color:#f8e2d0}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition-duration:.01ms!important;transition-delay:0ms!important}}@media(max-width:460px){.stage{height:clamp(680px,190vw,810px)}.env{top:59%}.message{font-size:clamp(11px,3.2vw,14px)}}

/* v29: Navigation and the approved home composition only. v26 rules above are untouched. */

/* v30: Full-bleed autumn environment on the home screen.

.home-screen{position:relative;isolation:isolate;background:transparent;overflow:hidden}
.home-screen::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:linear-gradient(#1d0e072d,#1d0e072d),url("assets/BALANCE_Autumn_background.png") center center/cover no-repeat}

/* Fade only the extreme outer edges of the composite on wide screens;

/* v30.1: viewport background correction. Overrides only backdrop/layout.

html,body{min-height:100%;background:#241108}
body::before{display:none!important}
#balanceBackdrop{position:fixed;inset:0;z-index:0;pointer-events:none;background:#241108 url("assets/BALANCE_Autumn_background.png") center center / cover no-repeat}

#homeBackdrop{position:fixed;inset:-35px;z-index:0;pointer-events:none;background:url("home/home.png") center center / cover no-repeat;filter:blur(18px) brightness(.75)}

@media(min-width:600px){
 .home-art{-webkit-mask-image:linear-gradient(to right,transparent 0%,#000 14%,#000 86%,transparent 100%);mask-image:linear-gradient(to right,transparent 0%,#000 14%,#000 86%,transparent 100%)}
}
@media(max-width:599px){#homeBackdrop{display:none}.home-art{-webkit-mask-image:none;mask-image:none}}
/* v31: approved responsive v17 home in isolated frame, preserving its typography and assets. */
#homeScreen{display:block;min-height:100dvh;width:100%;overflow:hidden}
#homeScreen iframe{width:100%;height:100dvh}
/* v31.1: same approved backdrop and wordmark across both scenes. */
#balanceBackdrop{background:#29180f url("home-v17/assets/autumn_background_approved.png") center center / cover no-repeat}
#balanceBackdrop::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 74% 27% at 46% 16%,rgba(19,7,4,.53),rgba(23,8,5,.31) 55%,transparent 100%),radial-gradient(ellipse 75% 19% at 46% 32%,rgba(23,8,5,.32),transparent 95%),radial-gradient(ellipse 70% 12% at 50% 92%,rgba(25,9,5,.15),transparent 90%)}
.letter-page{padding:clamp(18px,3dvh,30px) 12px 24px;min-height:100dvh;overflow:hidden}
.letter-header{position:relative;z-index:3}

.letter-page .env{top:36%}
@media(max-width:460px){.letter-page .stage{height:clamp(550px,153vw,690px)}.letter-page .env{top:37%}}
/* Cross-fade between scenes; no changes to the approved v26 envelope animation. */
#homeScreen,#letterScreen{transition:opacity .34s ease;opacity:1}
#homeScreen.scene-hidden,#letterScreen.scene-hidden{opacity:0;pointer-events:none}
@media(prefers-reduced-motion:reduce){#homeScreen,#letterScreen{transition:none}}

/* v31.2: balanced placement and softer scene transitions. */
.letter-page .env{top:46%}
@media(max-width:460px){.letter-page .env{top:46%}}
#homeScreen,#letterScreen{transition:opacity .62s cubic-bezier(.22,1,.36,1),filter .62s cubic-bezier(.22,1,.36,1);filter:blur(0);opacity:1}
#homeScreen.scene-hidden,#letterScreen.scene-hidden{opacity:0;filter:blur(3px);pointer-events:none}

/* Both scenes remain rendered during the cross-fade. */
body.scene-transitioning #homeScreen,body.scene-transitioning #letterScreen{position:absolute;top:0;left:0;width:100%}
body.scene-transitioning #homeScreen{z-index:2}
body.scene-transitioning #letterScreen{z-index:3}
@media(prefers-reduced-motion:reduce){#homeScreen,#letterScreen{transition:none;filter:none!important}}

.letter-page .env{top:52%}
@media(max-width:460px){.letter-page .env{top:52%}}
#homeScreen,#letterScreen{transition:opacity 1.05s ease-in-out,filter 1.05s ease-in-out}

#sceneVeil{position:fixed;inset:0;z-index:90;pointer-events:none;background:#170b08;opacity:0;transition:opacity .58s ease-in-out;will-change:opacity}

body.veil-on #sceneVeil{opacity:1}
#homeScreen,#letterScreen{transition:none!important;filter:none!important}
@media(prefers-reduced-motion:reduce){#sceneVeil{transition:none!important}}
/* BALANCE — universal smooth launch */
/* Hide the home screen until the launch animation finishes */
body:has(#balanceLaunch:not(.is-finished)) #homeScreen {
  visibility: hidden !important;
}
   
   #balanceLaunch {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: #171717;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 1;
  visibility: visible;
  transition: opacity .7s ease, visibility .7s ease;
}

#balanceLaunch.is-finished {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.balance-launch-word {
  display: flex;
  padding-left: .25em;
  gap: .25em;
  color: #f5f0e8;
  font: 500 clamp(25px, 7vw, 43px)/1.15 Arial, sans-serif;
}

.balance-launch-word span {
  opacity: 0;
  animation: balanceLetterReveal .85s ease forwards;
  animation-delay: calc(var(--i) * .23s);
}

@keyframes balanceLetterReveal {
  from { opacity: 0; transform: translateY(5px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (prefers-reduced-motion: reduce) {
  .balance-launch-word span {
    animation: none;
    opacity: 1;
  }
  #balanceLaunch {
    transition: none;
  }
}

</head><body>
<div id="balanceLaunch" aria-label="BALANCE завантажується">

  </div>
</div><div id="sceneVeil" aria-hidden="true"></div><div id="balanceBackdrop" aria-hidden="true"></div><div id="homeBackdrop" aria-hidden="true"></div>
<main id="homeScreen" class="home-screen" aria-label="BALANCE: обери лист на сьогодні"><iframe id="balanceHomeFrame" title="BALANCE — головний екран" src="home-v17/index.html" scrolling="auto" style="display:block;width:100%;height:100dvh;min-height:100svh;border:0;background:#29180f"></iframe></main>
<main id="letterScreen" class="page letter-page" hidden>
  <header class="letter-header"><h1 class="brand">BALANCE</h1><div class="tag">ДЕЯКІ ЛИСТИ ПРИХОДЯТЬ САМЕ ВЧАСНО</div></header>
  <button id="back" class="back-nav" type="button">← ПОВЕРНУТИСЬ ДО КОНВЕРТІВ</button>
  <div class="stage" id="stage" data-state="closed"><div class="env"><img class="piece back" src="assets/BALANCE_envelope_back_base_alpha.png"><div class="letter-clip"><div class="letter"><img class="paper" src="assets/BALANCE_paper_universal_alpha.png"><img class="heading" id="heading" src="assets/title_important.png"><div class="message" id="message"></div><div class="letter-signature" aria-label="BALANCE">BALANCE</div></div></div><img class="piece front" src="assets/BALANCE_envelope_front_corrected_alpha.png"><img class="piece flap" src="assets/BALANCE_envelope_top_flap_alpha.png"><img class="piece seal" src="assets/BALANCE_wax_seal_alpha.png"><img class="piece closed" src="assets/BALANCE_closed_envelope_alpha.png"><img class="autumn-twig autumn-twig--behind" src="assets/BALANCE_autumn_twig_alpha.png" alt="" aria-hidden="true"></div></div>
</main>
<script type="module" src="scripts/app-v29.mjs"></script><script>
(() => {
  const launch = document.getElementById('balanceLaunch');
  const homeFrame = document.getElementById('balanceHomeFrame');

  let frameReady = false;
  let animationReady = false;
  let finished = false;

  function finishLaunch() {
    if (finished || !frameReady || !animationReady) return;
    finished = true;
    launch.classList.add('is-finished');
  }

  homeFrame.addEventListener('load', () => {
    frameReady = true;
    finishLaunch();
  });

  setTimeout(() => {
    animationReady = true;
    finishLaunch();
  }, 3300);

  // Запасний вихід, якщо головний екран завантажується надто довго.
  setTimeout(() => {
    frameReady = true;
    animationReady = true;
    finishLaunch();
  }, 8000);
})();
</script>
